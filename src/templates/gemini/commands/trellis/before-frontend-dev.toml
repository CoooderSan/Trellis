description = "Read frontend development guidelines before starting your task"

prompt = """
Read the frontend development guidelines before starting your development task.

Execute these steps:
1. Read applicable team/project rules from `.trellis/spec/**` first.
   - If the repo contains a namespaced team/project rule set with `common/`, `develop/`, or `testing/`, treat those rules as primary.
   - For development tasks, include `common/*` and `develop/*`; add `testing/*` when the task affects tests or quality gates.
2. Read `.trellis/spec/frontend/index.md` to understand the default frontend guidelines when they exist.
3. Based on your task, read the relevant frontend guideline files:
   - Component work → `.trellis/spec/frontend/component-guidelines.md`
   - Hook work → `.trellis/spec/frontend/hook-guidelines.md`
   - State management → `.trellis/spec/frontend/state-management.md`
   - Type questions → `.trellis/spec/frontend/type-safety.md`
4. Follow team/project rules first, then use frontend defaults to fill in framework- or domain-specific details.
5. Then proceed with your development plan

This step is **mandatory** before writing any frontend code.
"""
