name: Manual team registry publish

# GitLab is the source of truth for Ecochain releases. Keep this workflow as a
# manual path only so mirroring tags or releases cannot publish packages.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Ecochain release tag (for example, ecochain-v0.6.15)"
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Ecochain release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^ecochain-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
            echo "Invalid Ecochain release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact immutable release tag checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Verify Ecochain package identities
        run: |
          test "$(node -p "require('./packages/cli/package.json').name")" = "@ecochain/trellis"
          test "$(node -p "require('./packages/core/package.json').name")" = "@ecochain/trellis-core"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version alignment (core, cli, git tag)
        run: GITHUB_REF_NAME="$RELEASE_TAG" node packages/cli/scripts/release-preflight.js check-versions --require-tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      # Build before test: integration tests spawn the real CLI via
      # bin/trellis.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Verify packed CLI pins core to exact version
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

      # Credentials are available only after build/tests, for this manually
      # selected tag. Basic auth is scoped to the existing team registry.
      - name: Configure team registry
        env:
          TEAM_REGISTRY_AUTH: ${{ secrets.TEAM_REGISTRY_AUTH }}
        run: |
          test -n "$TEAM_REGISTRY_AUTH"
          umask 077
          cat > "$RUNNER_TEMP/team-publish.npmrc" <<'NPMRC'
          registry=https://registry.npmjs.org/
          @ecochain:registry=https://packages.aliyun.com/63b637070a96c30780aae039/npm/npm-registry/
          //packages.aliyun.com/63b637070a96c30780aae039/npm/npm-registry/:_auth=${TEAM_REGISTRY_AUTH}
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/team-publish.npmrc" >> "$GITHUB_ENV"

      - name: Compute publish plan
        id: plan
        run: node packages/cli/scripts/release-preflight.js publish-plan --github
        env:
          TEAM_REGISTRY_AUTH: ${{ secrets.TEAM_REGISTRY_AUTH }}

      - name: Publish core then CLI to team registry
        env:
          TEAM_REGISTRY_AUTH: ${{ secrets.TEAM_REGISTRY_AUTH }}
          PUBLISH_CORE: ${{ steps.plan.outputs.core_publish }}
          PUBLISH_CLI: ${{ steps.plan.outputs.cli_publish }}
          DIST_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # This registry does not support npmjs provenance. Override only
          # the CI working copy; the committed package policy stays intact.
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const name of ["core", "cli"]) {
            const file = `packages/${name}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.publishConfig.provenance = false;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          }
          NODE
          # Build/tests already passed on the unchanged tagged source.
          # Copy the remaining prepublish assets before skipping duplicate
          # lifecycle scripts on the registry-specific package metadata.
          cp README.md LICENSE packages/cli/
          if [ "$PUBLISH_CORE" = true ]; then
            (cd packages/core && pnpm publish --ignore-scripts --access public --no-git-checks --tag "$DIST_TAG")
          fi
          if [ "$PUBLISH_CLI" = true ]; then
            (cd packages/cli && pnpm publish --ignore-scripts --access public --no-git-checks --tag "$DIST_TAG")
          fi

      - name: Verify both published packages and dist-tags
        run: node packages/cli/scripts/release-preflight.js verify-npm --package all
        env:
          TEAM_REGISTRY_AUTH: ${{ secrets.TEAM_REGISTRY_AUTH }}

      - name: Remove registry configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/team-publish.npmrc"
